<!doctype html><html lang="en" manifest="cache.appcache"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XLR8 // PS4</title><style>:root{--gold:#e7b85b;--bg:#08090b;--panel:#101216;--line:#29261f;--text:#eeeae0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif}body{overflow:hidden}.frame{position:relative;height:100%;display:grid;grid-template-rows:72px 1fr 48px;background:radial-gradient(circle at 50% 42%,rgba(231,184,91,.08),transparent 32%),linear-gradient(120deg,#07080a,#0d0f12 50%,#07080a)}.header{display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line);background:rgba(8,9,11,.8);backdrop-filter:blur(14px)}.logo{display:flex;align-items:center;gap:12px}.logoMark{width:35px;height:35px;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-weight:900;transform:rotate(45deg)}.logoMark span{transform:rotate(-45deg)}.logoText b{font-size:13px;letter-spacing:.24em}.logoText small{display:block;color:#5f5c55;font:9px ui-monospace,Consolas,monospace;letter-spacing:.16em;margin-top:3px}.headerCode{font:10px ui-monospace,Consolas,monospace;color:#625f57;letter-spacing:.16em}.center{display:grid;place-items:center;padding:30px}.loaderCard{width:min(560px,100%);padding:45px;border:1px solid var(--line);background:rgba(15,17,20,.88);text-align:center;box-shadow:0 25px 90px rgba(0,0,0,.48);position:relative}.loaderCard:before,.loaderCard:after{content:"";position:absolute;width:34px;height:34px;border-color:var(--gold);border-style:solid}.loaderCard:before{left:-1px;top:-1px;border-width:1px 0 0 1px}.loaderCard:after{right:-1px;bottom:-1px;border-width:0 1px 1px 0}.badge{font:9px ui-monospace,Consolas,monospace;letter-spacing:.28em;color:var(--gold);margin-bottom:28px}#spin{width:56px;height:56px;margin:0 auto 25px;border:1px solid #29261f;border-top-color:var(--gold);border-right-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;box-shadow:0 0 30px rgba(231,184,91,.08)}@keyframes spin{to{transform:rotate(360deg)}}#msg{font:700 14px ui-monospace,Consolas,monospace;letter-spacing:.08em;color:#ddd8ce}#wrap{display:none}body.done #spin,body.fail #spin{display:none}body.fail #msg{display:block;color:#d0a68d}body.done #msg{display:block;color:var(--gold);letter-spacing:.16em}body.log .center{display:none}body.log #wrap{display:block;padding:22px 5vw;height:calc(100vh - 120px);overflow:auto}body.log #state{font:700 22px ui-monospace,Consolas,monospace;color:var(--gold);margin-bottom:12px}body.log #out{white-space:pre-wrap;background:#0c0d0f;border:1px solid var(--line);padding:16px;font:11px/1.6 ui-monospace,Consolas,monospace;color:#aaa69d;min-height:70vh}footer{display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-top:1px solid var(--line);color:#504d47;font:9px ui-monospace,Consolas,monospace;letter-spacing:.15em}footer b{font-weight:500;color:#77736a}@media(max-width:600px){.header{padding:0 20px}.headerCode{display:none}.center{padding:20px}.loaderCard{padding:38px 24px}footer{padding:0 20px}}</style></head><body><div class="frame"><header class="header"><div class="logo"><div class="logoMark"><span>G</span></div><div class="logoText"><b>GOLD SYSTEM</b><small>PS4 CONSOLE INTERFACE</small></div></div><div class="headerCode">SESSION / LOCAL / 01</div></header><section class="center"><div class="loaderCard"><div class="badge">SYSTEM HANDSHAKE</div><div id="spin"></div><div id="msg">Preparing console...</div><div id="wrap"><div id="state"></div><div id="out"></div></div></div></section><footer><span>GOLD / PS4</span><b>STATIC CONSOLE UI</b></footer></div><script type="module">import "./jb.js?v=19";</script></body></html>
